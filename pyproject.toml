[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-agent-scaling"
version = "0.1.0"
description = "Reproducible PostgreSQL query rewriting experiment across three agent architectures"
requires-python = ">=3.11"
dependencies = [
  "httpx[socks]>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlglot>=27",
  "langgraph>=1.0,<2",
  "langgraph-swarm>=0.1,<0.2",
  "langchain>=1,<2",
  "pydantic>=2,<3",
  "langchain-openai>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
benchmark = "benchmark.runner:main"
benchmark-report = "benchmark.report:main"

[tool.hatch.build.targets.wheel]
packages = ["agents", "tools", "benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL fixture"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
